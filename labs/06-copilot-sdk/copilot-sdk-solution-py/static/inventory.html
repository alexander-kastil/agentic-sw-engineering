<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory - ContosoShop Support Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="nav"></div>
    <div class="container mt-4">
        <h2 class="mb-4">Inventory Management</h2>
        <table class="table align-middle">
            <thead>
                <tr><th>Item Number</th><th>Product</th><th class="text-end">Price</th><th class="text-end">Stock</th><th class="text-end">Returned</th></tr>
            </thead>
            <tbody id="products"></tbody>
        </table>
    </div>
    <script src="/js/app.js"></script>
    <script>
        (async () => {
            await renderNav();
            const products = await api("/api/inventory");
            document.getElementById("products").innerHTML = products.map(product => `
                <tr>
                    <td>${product.item_number}</td>
                    <td>${escapeHtml(product.name)}</td>
                    <td class="text-end">${money(product.price)}</td>
                    <td class="text-end">${product.stock}</td>
                    <td class="text-end">${product.returned}</td>
                </tr>`).join("");
        })();
    </script>
</body>
</html>
