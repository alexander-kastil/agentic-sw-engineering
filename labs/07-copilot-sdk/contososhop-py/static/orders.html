<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Orders - ContosoShop Support Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="nav"></div>
    <div class="container mt-4">
        <h2 class="mb-4">My Orders</h2>
        <table class="table table-hover align-middle">
            <thead>
                <tr><th>Order #</th><th>Date</th><th>Status</th><th class="text-end">Total</th><th></th></tr>
            </thead>
            <tbody id="orders"></tbody>
        </table>
    </div>
    <script src="/js/app.js"></script>
    <script>
        (async () => {
            await renderNav();
            const orders = await api("/api/orders");
            document.getElementById("orders").innerHTML = orders.map(order => `
                <tr>
                    <td>#${order.id}</td>
                    <td>${formatDate(order.order_date)}</td>
                    <td>${statusBadge(order.status)}</td>
                    <td class="text-end">${money(order.total_amount)}</td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary" href="/order.html?id=${order.id}">View Details</a></td>
                </tr>`).join("");
        })();
    </script>
</body>
</html>
