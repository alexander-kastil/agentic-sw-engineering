<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Details - ContosoShop Support Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="nav"></div>
    <div class="container mt-4">
        <a href="/orders.html" class="text-decoration-none">&larr; Back to My Orders</a>
        <div id="message" class="alert mt-3 d-none"></div>
        <div id="order" class="mt-3"></div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        const orderId = new URLSearchParams(location.search).get("id");
        let returnMode = false;
        let order = null;

        function returnable() {
            return ["Delivered", "PartialReturn", "Returned"].includes(order.status)
                && order.items.some(item => item.remaining_quantity > 0);
        }

        function render() {
            const returnHeaders = returnMode ? "<th>Return</th><th>Return Qty</th>" : "";
            const rows = order.items.map(item => {
                const badge = item.returned_quantity > 0
                    ? ` <span class="badge bg-warning text-dark">Returned ${item.returned_quantity} of ${item.quantity}</span>` : "";
                const returnCells = returnMode
                    ? `<td><input type="checkbox" class="form-check-input return-check" data-id="${item.id}" ${item.remaining_quantity === 0 ? "disabled" : ""}></td>
                       <td><input type="number" class="form-control form-control-sm return-qty" data-id="${item.id}" min="1" max="${item.remaining_quantity}" value="1" style="width: 5rem" ${item.remaining_quantity === 0 ? "disabled" : ""}></td>`
                    : "";
                return `<tr>${returnCells}<td>${escapeHtml(item.product_name)}${badge}</td><td>${item.quantity}</td><td>${item.returned_quantity}</td><td class="text-end">${money(item.price)}</td></tr>`;
            }).join("");

            document.getElementById("order").innerHTML = `
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Order #${order.id}</h4>${statusBadge(order.status)}
                    </div>
                    <div class="card-body">
                        <p class="mb-1"><strong>Order date:</strong> ${formatDate(order.order_date)}</p>
                        ${order.ship_date ? `<p class="mb-1"><strong>Shipped:</strong> ${formatDate(order.ship_date)}</p>` : ""}
                        ${order.delivery_date ? `<p class="mb-1"><strong>Delivered:</strong> ${formatDate(order.delivery_date)}</p>` : ""}
                        <p><strong>Total:</strong> ${money(order.total_amount)}</p>
                        <table class="table align-middle">
                            <thead><tr>${returnHeaders}<th>Item</th><th>Qty</th><th>Returned</th><th class="text-end">Price</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                        <div id="actions"></div>
                    </div>
                </div>`;

            const actions = document.getElementById("actions");
            if (!returnMode && returnable()) {
                actions.innerHTML = `<button class="btn btn-warning" id="start-return">Return Items</button>`;
                document.getElementById("start-return").addEventListener("click", () => { returnMode = true; render(); });
            }
            if (returnMode) {
                actions.innerHTML = `<button class="btn btn-danger me-2" id="submit-return" disabled>Submit Return (0 items)</button>
                                     <button class="btn btn-secondary" id="cancel-return">Cancel</button>`;
                document.getElementById("cancel-return").addEventListener("click", () => { returnMode = false; render(); });
                document.querySelectorAll(".return-check, .return-qty").forEach(el => el.addEventListener("input", updateSubmit));
                document.getElementById("submit-return").addEventListener("click", submitReturn);
            }
        }

        function selectedItems() {
            return [...document.querySelectorAll(".return-check:checked")].map(check => ({
                order_item_id: Number(check.dataset.id),
                quantity: Number(document.querySelector(`.return-qty[data-id="${check.dataset.id}"]`).value),
                reason: "Customer requested return",
            }));
        }

        function updateSubmit() {
            const count = selectedItems().reduce((sum, item) => sum + item.quantity, 0);
            const button = document.getElementById("submit-return");
            button.textContent = `Submit Return (${count} item${count === 1 ? "" : "s"})`;
            button.disabled = count === 0;
        }

        async function submitReturn() {
            const message = document.getElementById("message");
            try {
                order = await api(`/api/orders/${orderId}/return`, { method: "POST", body: JSON.stringify({ items: selectedItems() }) });
                message.className = "alert alert-success mt-3";
                message.textContent = "Your return has been processed. A confirmation email is on its way.";
                returnMode = false;
                render();
            } catch (e) {
                message.className = "alert alert-danger mt-3";
                message.textContent = e.message;
            }
        }

        (async () => {
            await renderNav();
            order = await api(`/api/orders/${orderId}`);
            render();
        })();
    </script>
</body>
</html>
