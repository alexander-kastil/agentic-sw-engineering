<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bg:#ffffff; --fg:#1b1f24; --muted:#57606a; --line:#8c959f;
      --in:#eaf2ff; --inS:#3b6fd4; --tool:#e9f7ef; --toolS:#2f8f5b;
      --core:#fff6e5; --coreS:#c98a12; --host:#f6f8fa; --hostS:#8c959f;
      --hook:#fdecec; --hookS:#c24141; --plug:#f3edff; --plugS:#7a4fd0; --entry:#f0f0f0; --entryS:#57606a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9da7b3; --line:#6e7681;
        --in:#132441; --inS:#5b8ff0; --tool:#10291c; --toolS:#46b37a;
        --core:#2b2210; --coreS:#e0a534; --host:#161b22; --hostS:#6e7681;
        --hook:#331414; --hookS:#e06666; --plug:#221a38; --plugS:#9d7bec; --entry:#1f242b; --entryS:#9da7b3; }
    }
    .bg{fill:var(--bg)} .t{fill:var(--fg)} .m{fill:var(--muted)}
    .h{font-size:15px;font-weight:600} .s{font-size:12.5px} .xs{font-size:11.5px}
    .title{font-size:22px;font-weight:700}
    .in{fill:var(--in);stroke:var(--inS)} .tool{fill:var(--tool);stroke:var(--toolS)}
    .core{fill:var(--core);stroke:var(--coreS)} .host{fill:var(--host);stroke:var(--hostS);stroke-dasharray:6 4}
    .hook{fill:var(--hook);stroke:var(--hookS)} .plug{fill:var(--plug);stroke:var(--plugS)}
    .entry{fill:var(--entry);stroke:var(--entryS)}
    rect{stroke-width:1.5}
    .a{stroke:var(--line);stroke-width:1.6;fill:none;marker-end:url(#arr)}
    .ab{stroke:var(--line);stroke-width:1.6;fill:none;marker-end:url(#arr);marker-start:url(#arrS)}
    .ad{stroke:var(--line);stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#arr)}
    .hd{stroke:var(--hookS);stroke-width:1.4;fill:none;stroke-dasharray:4 3;marker-end:url(#arrH)}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8c959f"/></marker>
    <marker id="arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="880" style="stroke:none"/>
  <text class="t title" x="40" y="44">Agentic Harness: How the Customization Layers Work Together</text>

  <!-- Entry row -->
  <rect class="entry" x="40" y="80" width="200" height="70" rx="10"/>
  <text class="t h" x="140" y="110" text-anchor="middle">Developer</text>
  <text class="m s" x="140" y="130" text-anchor="middle">chat request</text>

  <rect class="entry" x="300" y="80" width="260" height="70" rx="10"/>
  <text class="t h" x="430" y="106" text-anchor="middle">Prompt Files (.prompt.md)</text>
  <text class="m s" x="430" y="126" text-anchor="middle">reusable workflows, run on demand</text>
  <text class="m xs" x="430" y="142" text-anchor="middle">can pin agent, tools, model</text>

  <rect class="entry" x="640" y="80" width="260" height="70" rx="10"/>
  <text class="t h" x="770" y="106" text-anchor="middle">Custom Agents</text>
  <text class="m s" x="770" y="126" text-anchor="middle">persona + tools + instructions</text>
  <text class="m xs" x="770" y="142" text-anchor="middle">handoffs between agents</text>

  <path class="a" d="M240,115 L296,115"/>
  <text class="m xs" x="268" y="108" text-anchor="middle">/cmd</text>
  <path class="a" d="M560,115 L636,115"/>
  <text class="m xs" x="598" y="108" text-anchor="middle">selects</text>
  <path class="a" d="M430,150 L430,196"/>
  <text class="m xs" x="436" y="178">invokes</text>
  <path class="a" d="M770,150 L770,196"/>
  <text class="m xs" x="776" y="178">configures session</text>

  <!-- Agent Host container -->
  <rect class="host" x="300" y="200" width="600" height="440" rx="14"/>
  <text class="t h" x="320" y="226">Agent Host</text>
  <text class="m s" x="410" y="226">session target: Copilot | Claude | Codex | Cloud</text>

  <!-- Agent loop -->
  <rect class="core" x="330" y="245" width="540" height="270" rx="12"/>
  <text class="t h" x="600" y="272" text-anchor="middle">Agent Loop (Model + Context Window)</text>

  <rect class="core" x="355" y="300" width="110" height="54" rx="27"/>
  <text class="t s" x="410" y="323" text-anchor="middle">Assemble</text>
  <text class="t s" x="410" y="340" text-anchor="middle">context</text>
  <rect class="core" x="487" y="300" width="110" height="54" rx="27"/>
  <text class="t s" x="542" y="323" text-anchor="middle">Model</text>
  <text class="t s" x="542" y="340" text-anchor="middle">reasons</text>
  <rect class="core" x="619" y="300" width="110" height="54" rx="27"/>
  <text class="t s" x="674" y="323" text-anchor="middle">Call</text>
  <text class="t s" x="674" y="340" text-anchor="middle">tool</text>
  <rect class="core" x="751" y="300" width="100" height="54" rx="27"/>
  <text class="t s" x="801" y="323" text-anchor="middle">Observe</text>
  <text class="t s" x="801" y="340" text-anchor="middle">result</text>

  <path class="a" d="M465,327 L483,327"/>
  <path class="a" d="M597,327 L615,327"/>
  <path class="a" d="M729,327 L747,327"/>
  <path class="a" d="M801,354 L801,390 L542,390 L542,358"/>
  <text class="m xs" x="672" y="384" text-anchor="middle">repeat until task done</text>

  <text class="m s" x="600" y="430" text-anchor="middle">Only what is relevant is loaded: instructions by file scope,</text>
  <text class="m s" x="600" y="448" text-anchor="middle">skills by description match, MCP tools by selection.</text>
  <text class="m s" x="600" y="476" text-anchor="middle">Result: diffs, commands, answers back to the developer</text>
  <text class="m xs" x="600" y="496" text-anchor="middle">(or handoff to the next custom agent)</text>

  <!-- Hooks -->
  <rect class="hook" x="330" y="540" width="540" height="82" rx="10"/>
  <text class="t h" x="600" y="564" text-anchor="middle">Hooks</text>
  <text class="t s" x="600" y="584" text-anchor="middle">shell commands on lifecycle events: session start/end,</text>
  <text class="t s" x="600" y="601" text-anchor="middle">before/after tool use, prompt submit</text>
  <text class="m xs" x="600" y="616" text-anchor="middle">logging · validation · blocking · notifications</text>
  <path class="hd" d="M674,540 L674,358"/>
  <path class="hd" d="M410,540 L410,358"/>

  <!-- Context sources (left) -->
  <text class="m s" x="40" y="192" font-weight="600">CONTEXT SOURCES</text>
  <rect class="in" x="40" y="200" width="220" height="92" rx="10"/>
  <text class="t h" x="150" y="224" text-anchor="middle">Instructions</text>
  <text class="t xs" x="150" y="244" text-anchor="middle">repo-wide: security, naming,</text>
  <text class="t xs" x="150" y="260" text-anchor="middle">coding philosophy</text>
  <text class="t xs" x="150" y="278" text-anchor="middle">stack-specific: Angular, .NET, ...</text>

  <rect class="in" x="40" y="306" width="220" height="72" rx="10"/>
  <text class="t h" x="150" y="330" text-anchor="middle">AGENTS.md</text>
  <text class="t xs" x="150" y="350" text-anchor="middle">harness-agnostic rules,</text>
  <text class="t xs" x="150" y="366" text-anchor="middle">read by every session target</text>

  <rect class="in" x="40" y="392" width="220" height="100" rx="10"/>
  <text class="t h" x="150" y="416" text-anchor="middle">Agent Skills</text>
  <text class="t xs" x="150" y="436" text-anchor="middle">folders: SKILL.md + scripts</text>
  <text class="t xs" x="150" y="452" text-anchor="middle">+ resources (open standard)</text>
  <text class="t xs" x="150" y="470" text-anchor="middle">loaded when relevant,</text>
  <text class="t xs" x="150" y="485" text-anchor="middle">no manual activation</text>

  <rect class="in" x="40" y="506" width="220" height="92" rx="10"/>
  <text class="t h" x="150" y="530" text-anchor="middle">Memory</text>
  <text class="t xs" x="150" y="550" text-anchor="middle">persists across sessions:</text>
  <text class="t xs" x="150" y="566" text-anchor="middle">project facts, preferences,</text>
  <text class="t xs" x="150" y="582" text-anchor="middle">task state</text>

  <path class="a" d="M260,246 L326,300"/>
  <path class="a" d="M260,342 L326,330"/>
  <path class="a" d="M260,442 L326,360"/>
  <path class="ab" d="M260,552 L326,395"/>
  <text class="m xs" x="272" y="485" transform="rotate(-62 272 485)">read / write</text>

  <!-- Tools (right) -->
  <text class="m s" x="940" y="192" font-weight="600">CAPABILITIES (TOOLS)</text>
  <rect class="tool" x="940" y="200" width="220" height="124" rx="10"/>
  <text class="t h" x="1050" y="224" text-anchor="middle">MCP Servers</text>
  <text class="t xs" x="1050" y="244" text-anchor="middle">local: npx / stdio executables</text>
  <text class="t xs" x="1050" y="260" text-anchor="middle">remote: HTTP endpoints</text>
  <text class="t xs" x="1050" y="278" text-anchor="middle">config: workspace or global</text>
  <text class="t xs" x="1050" y="294" text-anchor="middle">mcp.json, MCP Registry</text>
  <text class="t xs" x="1050" y="312" text-anchor="middle">own servers: Python, C#</text>

  <rect class="tool" x="940" y="338" width="220" height="84" rx="10"/>
  <text class="t h" x="1050" y="362" text-anchor="middle">MCP Apps</text>
  <text class="t xs" x="1050" y="382" text-anchor="middle">server-provided ui:// views</text>
  <text class="t xs" x="1050" y="398" text-anchor="middle">rendered inline in chat</text>

  <rect class="tool" x="940" y="436" width="220" height="80" rx="10"/>
  <text class="t h" x="1050" y="460" text-anchor="middle">Built-in Tools</text>
  <text class="t xs" x="1050" y="480" text-anchor="middle">edit files, terminal,</text>
  <text class="t xs" x="1050" y="496" text-anchor="middle">search, fetch</text>

  <path class="ab" d="M874,310 L936,262"/>
  <path class="ab" d="M874,330 L936,380"/>
  <path class="ab" d="M874,350 L936,476"/>
  <text class="m xs" x="905" y="300" text-anchor="middle" transform="rotate(-38 905 300)">call / result</text>

  <!-- Plugins -->
  <rect class="plug" x="40" y="690" width="1120" height="160" rx="14"/>
  <text class="t h" x="60" y="718">Agent Plugins (Agent Plugins 1.0)</text>
  <text class="m s" x="60" y="738">Packaging and distribution layer: one manifest bundles the building blocks above, loaded locally via chat.pluginLocations</text>

  <rect class="plug" x="60" y="758" width="160" height="70" rx="8"/>
  <text class="t s" x="140" y="787" text-anchor="middle" font-weight="600">plugin manifest</text>
  <text class="m xs" x="140" y="806" text-anchor="middle">schema, metadata</text>
  <rect class="plug" x="240" y="758" width="160" height="70" rx="8"/>
  <text class="t s" x="320" y="787" text-anchor="middle" font-weight="600">skills/</text>
  <text class="m xs" x="320" y="806" text-anchor="middle">portable core</text>
  <rect class="plug" x="420" y="758" width="160" height="70" rx="8"/>
  <text class="t s" x="500" y="787" text-anchor="middle" font-weight="600">mcp.json</text>
  <text class="m xs" x="500" y="806" text-anchor="middle">portable core</text>
  <rect class="plug" x="600" y="758" width="160" height="70" rx="8"/>
  <text class="t s" x="680" y="787" text-anchor="middle" font-weight="600">agents, commands</text>
  <text class="m xs" x="680" y="806" text-anchor="middle">custom agents, prompts</text>
  <rect class="plug" x="780" y="758" width="160" height="70" rx="8"/>
  <text class="t s" x="860" y="787" text-anchor="middle" font-weight="600">hooks</text>
  <text class="m xs" x="860" y="806" text-anchor="middle">lifecycle scripts</text>
  <rect class="plug" x="960" y="758" width="180" height="70" rx="8"/>
  <text class="t s" x="1050" y="787" text-anchor="middle" font-weight="600">com.github.copilot/</text>
  <text class="m xs" x="1050" y="806" text-anchor="middle">harness-specific parts</text>

  <path class="ad" d="M600,690 L600,644"/>
  <text class="m xs" x="608" y="672">installs into harness</text>
</svg>
