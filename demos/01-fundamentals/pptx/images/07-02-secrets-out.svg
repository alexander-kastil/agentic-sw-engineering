<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g stroke="#8c959f" stroke-width="2">
    <rect x="80" y="80" width="1100" height="150" rx="22" fill="#eaf2ff"/>
    <rect x="80" y="260" width="1100" height="150" rx="22" fill="#e9f7ef"/>
    <rect x="80" y="440" width="1100" height="150" rx="22" fill="#f3edff"/>
    <rect x="80" y="620" width="1100" height="150" rx="22" fill="#fff6e5"/>
    <rect x="80" y="800" width="1100" height="150" rx="22" fill="#f6f8fa"/>
  </g>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="110" y="120" width="290" height="70" rx="35"/>
    <rect x="110" y="300" width="290" height="70" rx="35"/>
    <rect x="110" y="480" width="290" height="70" rx="35"/>
    <rect x="110" y="660" width="290" height="70" rx="35"/>
    <rect x="110" y="840" width="290" height="70" rx="35"/>
  </g>
  <g text-anchor="middle" font-size="28" font-weight="600" fill="#57606a">
    <text x="255" y="165">Workspace</text>
    <text x="255" y="345">Editor</text>
    <text x="255" y="525">Agent behavior</text>
    <text x="255" y="705">IDE level</text>
    <text x="255" y="885">System level</text>
  </g>
  <g font-size="34" font-weight="600" fill="#24292f">
    <text x="440" y="145"><tspan font-family="Consolas, monospace">.gitignore</tspan> exclusion</text>
    <text x="440" y="325">VS Code file disabling</text>
    <text x="440" y="505">Custom instructions</text>
    <text x="440" y="685">Workspace trust</text>
    <text x="440" y="865">Environment isolation</text>
  </g>
  <g font-size="28" fill="#57606a">
    <text x="440" y="192">keeps secrets from being tracked or shared</text>
    <text x="440" y="372">turns Copilot off for <tspan font-family="Consolas, monospace">.env</tspan> and <tspan font-family="Consolas, monospace">*.secrets</tspan></text>
    <text x="440" y="552">security guidelines against including credentials</text>
    <text x="440" y="732">untrusted workspaces limit extensions</text>
    <text x="440" y="912">secrets stored apart from workspace context</text>
  </g>
  <rect x="1250" y="260" width="600" height="510" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <g font-size="30" font-family="Consolas, monospace" fill="#24292f">
    <text x="1290" y="330">{</text>
    <text x="1323" y="385">"github.copilot.enable": {</text>
    <text x="1356" y="440">"*": true,</text>
    <text x="1356" y="495">".env": false,</text>
    <text x="1356" y="550">"*.secrets": false,</text>
    <text x="1356" y="605">"*.private": false</text>
    <text x="1323" y="660">}</text>
    <text x="1290" y="715">}</text>
  </g>
  <text x="1550" y="825" text-anchor="middle" font-size="28" fill="#57606a">workspace settings</text>
</svg>
