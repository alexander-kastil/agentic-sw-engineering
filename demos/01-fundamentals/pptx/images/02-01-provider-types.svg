<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="80" y="390" width="380" height="300" rx="26" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="270" y="530" text-anchor="middle" font-size="38" font-weight="600" fill="#24292f">Copilot</text>
  <text x="270" y="580" text-anchor="middle" font-size="38" font-weight="600" fill="#24292f">model picker</text>
  <g stroke="#8c959f" stroke-width="2">
    <rect x="640" y="90" width="560" height="170" rx="22" fill="#eaf2ff"/>
    <rect x="640" y="320" width="560" height="170" rx="22" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <rect x="640" y="550" width="560" height="170" rx="22" fill="#e9f7ef"/>
    <rect x="640" y="780" width="560" height="170" rx="22" fill="#f6f8fa"/>
  </g>
  <g text-anchor="middle" font-size="36" font-weight="600" fill="#24292f">
    <text x="920" y="160">Built-in Copilot models</text>
    <text x="920" y="390">BYOK</text>
    <text x="920" y="620">Custom Endpoint</text>
    <text x="920" y="850">Marketplace providers</text>
  </g>
  <g text-anchor="middle" font-size="28" fill="#57606a">
    <text x="920" y="210">Signed-in Copilot license</text>
