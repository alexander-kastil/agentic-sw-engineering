    <text x="1250" y="395">Air-gapped or offline work,</text>
    <text x="1250" y="435">direct billing</text>
    <text x="1250" y="625">Self-hosted or proxied models</text>
    <text x="1250" y="665">behind your own gateway</text>
    <text x="1250" y="855">A provider Copilot</text>
    <text x="1250" y="895">does not ship by default</text>
  </g>
  <g stroke="#57606a" stroke-width="3" marker-end="url(#a)">
    <line x1="464" y1="470" x2="634" y2="175"/>
    <line x1="464" y1="515" x2="634" y2="405"/>
    <line x1="464" y1="565" x2="634" y2="635"/>
    <line x1="464" y1="610" x2="634" y2="865"/>
