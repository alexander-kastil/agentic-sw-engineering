    <text x="1505" y="115" text-anchor="middle">What compression keeps</text>
  </g>
  <g font-size="34" font-weight="600" fill="#24292f">
    <text x="80" y="232">Test runners</text>
    <text x="80" y="402">Build tools</text>
    <text x="80" y="572">Linters</text>
    <text x="80" y="742">Docker</text>
    <text x="80" y="912">Package managers</text>
  </g>
  <g fill="#f6f8fa" stroke="#9da7b3" stroke-width="2" stroke-dasharray="10 8">
    <rect x="440" y="150" width="640" height="140" rx="20"/>
    <rect x="440" y="320" width="640" height="140" rx="20"/>
    <rect x="440" y="490" width="640" height="140" rx="20"/>
    <rect x="440" y="660" width="640" height="140" rx="20"/>
    <rect x="440" y="830" width="640" height="140" rx="20"/>
  </g>
  <g text-anchor="middle" font-size="30" fill="#57606a">
    <text x="760" y="231">Per-test pass lines, timing noise</text>
