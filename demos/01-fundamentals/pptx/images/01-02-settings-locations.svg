    <text x="960" y="385">Project-specific overrides</text>
    <text x="960" y="430">for team consistency</text>
    <text x="1560" y="385">Standardized environments,</text>
    <text x="1560" y="430">pre-configured extensions</text>
  </g>
  <rect x="90" y="590" width="1740" height="400" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <g font-size="30" font-family="Consolas, monospace" fill="#24292f">
    <text x="140" y="660">{</text>
    <text x="173" y="715">"github.copilot.enable": { "*": true, "markdown": true, "plaintext": false, "yaml": true },</text>
    <text x="173" y="770">"editor.inlineSuggest.enabled": true,</text>
    <text x="173" y="825">"github.copilot.chat.codesearch.enabled": true,</text>
    <text x="173" y="880">"github.copilot.chat.claudeAgent.enabled": true</text>
    <text x="140" y="935">}</text>
