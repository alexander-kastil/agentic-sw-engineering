<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g stroke="#8c959f" stroke-width="2">
    <rect x="90" y="100" width="540" height="420" rx="24" fill="#eaf2ff"/>
    <rect x="690" y="100" width="540" height="420" rx="24" fill="#e9f7ef"/>
    <rect x="1290" y="100" width="540" height="420" rx="24" fill="#f3edff"/>
  </g>
  <g text-anchor="middle" font-size="38" font-weight="600" fill="#24292f">
    <text x="360" y="185">User settings</text>
    <text x="960" y="185">Workspace</text>
    <text x="1560" y="185">Dev Container</text>
  </g>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="150" y="230" width="420" height="64" rx="32"/>
    <rect x="750" y="230" width="420" height="64" rx="32"/>
    <rect x="1310" y="230" width="500" height="64" rx="32"/>
  </g>
  <g text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">
    <text x="360" y="271">user settings.json</text>
    <text x="960" y="271">.vscode/settings.json</text>
    <text x="1560" y="271">.devcontainer/devcontainer.json</text>
  </g>
  <g text-anchor="middle" font-size="30" fill="#57606a">
    <text x="360" y="385">Personal preferences</text>
