<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="#24292f" text-anchor="middle">
    <rect x="80" y="420" width="260" height="180" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="210" y="522" font-size="34" font-weight="600">Your prompt</text>
    <rect x="420" y="420" width="340" height="180" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="590" y="498" font-size="34" font-weight="600">Model reasons</text>
    <text x="590" y="548" font-size="28" fill="#57606a">over context</text>
    <rect x="840" y="420" width="340" height="180" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1010" y="498" font-size="34" font-weight="600">Calls a tool</text>
    <text x="1010" y="548" font-size="28" fill="#57606a">read, edit, run</text>
    <polygon points="1440,380 1610,510 1440,640 1270,510" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="1440" y="500" font-size="32" font-weight="600">Approval</text>
    <text x="1440" y="542" font-size="32" font-weight="600">needed?</text>
    <rect x="1290" y="760" width="300" height="140" rx="24" fill="#ffffff" stroke="#e0a534" stroke-width="3"/>
    <text x="1440" y="842" font-size="34" font-weight="600">You confirm</text>
    <text x="1470" y="712" font-size="28" fill="#57606a" text-anchor="start">Yes</text>
    <text x="1470" y="345" font-size="28" fill="#57606a" text-anchor="start">No</text>
  </g>
  <g stroke="#57606a" stroke-width="4" fill="none" marker-end="url(#a)">
    <line x1="340" y1="510" x2="412" y2="510"/>
    <line x1="760" y1="510" x2="832" y2="510"/>
    <line x1="1180" y1="510" x2="1262" y2="510"/>
    <line x1="1440" y1="640" x2="1440" y2="752"/>
    <path d="M1290,830 H590 V608"/>
    <path d="M1440,380 V290 H590 V412"/>
  </g>
  <text x="960" y="1010" text-anchor="middle" font-size="30" fill="#57606a">repeat until done, blocked on you, or stopped</text>
</svg>
