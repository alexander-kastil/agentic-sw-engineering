    <text x="1590" y="465" font-size="34" font-weight="600">Coder</text>
    <text x="1590" y="515" font-size="28" fill="#57606a">apply theme everywhere</text>
    <text x="1590" y="740" font-size="28" fill="#57606a">waits for phase 2</text>
    <rect x="160" y="840" width="720" height="84" rx="42" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="520" y="894" font-size="30" font-weight="600" fill="#c24141">same file in two agents = conflict</text>
    <rect x="1040" y="840" width="720" height="84" rx="42" fill="#e9f7ef" stroke="#2f7d4f" stroke-width="2"/>
