    <text x="330" y="258" font-size="36" font-weight="600">Phase 1</text>
    <rect x="110" y="290" width="440" height="180" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="330" y="360" font-size="34" font-weight="600">Frontend</text>
    <text x="330" y="410" font-size="28" fill="#57606a">toggle UI design</text>
    <rect x="110" y="500" width="440" height="180" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="330" y="570" font-size="34" font-weight="600">Coder</text>
    <text x="330" y="620" font-size="28" fill="#57606a">color palette</text>
    <text x="330" y="740" font-size="28" fill="#57606a">parallel</text>
    <rect x="710" y="200" width="500" height="570" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="258" font-size="36" font-weight="600">Phase 2</text>
