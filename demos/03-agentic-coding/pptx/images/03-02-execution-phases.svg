    <text x="960" y="350" font-size="34" font-weight="600">Coder</text>
    <text x="960" y="395" font-size="26" fill="#57606a" font-family="Consolas, monospace">ThemeContext.tsx</text>
    <text x="960" y="435" font-size="26" fill="#57606a" font-family="Consolas, monospace">useTheme.ts</text>
    <rect x="740" y="500" width="440" height="180" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="570" font-size="34" font-weight="600">Frontend</text>
    <text x="960" y="620" font-size="28" fill="#57606a">toggle component</text>
    <text x="960" y="740" font-size="28" fill="#57606a">parallel, different files</text>
    <rect x="1340" y="200" width="500" height="570" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1590" y="258" font-size="36" font-weight="600">Phase 3</text>
