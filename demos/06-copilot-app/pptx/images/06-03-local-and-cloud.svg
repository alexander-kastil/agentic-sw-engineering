<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="120" y="80" width="800" height="740" rx="28" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <rect x="1000" y="80" width="800" height="740" rx="28" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <g fill="#24292f">
