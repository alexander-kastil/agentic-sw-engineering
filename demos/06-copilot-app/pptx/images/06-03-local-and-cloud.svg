    <line x1="1050" y1="325" x2="1750" y2="325"/><line x1="1050" y1="435" x2="1750" y2="435"/>
    <line x1="1050" y1="545" x2="1750" y2="545"/><line x1="1050" y1="655" x2="1750" y2="655"/>
  </g>
  <rect x="120" y="880" width="1680" height="120" rx="28" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="960" y="955" font-size="36" font-weight="600" fill="#24292f" text-anchor="middle">One automation, several triggers</text>
