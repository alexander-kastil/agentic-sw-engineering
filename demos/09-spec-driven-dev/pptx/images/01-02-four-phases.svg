    <text x="1190" y="460">What are the concrete</text>
    <text x="1190" y="505">work items, in</text>
    <text x="1190" y="550">what order?</text>
    <rect x="1460" y="370" width="380" height="260" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1650" y="485">Does the code</text>
