<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="#24292f">
    <rect x="260" y="110" width="1400" height="160" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="320" y="178" font-size="34" font-weight="600">Install the CLI once</text>
    <text x="320" y="232" font-size="30" font-family="Consolas, monospace">uv tool install specify-cli --reinstall</text>
    <rect x="260" y="340" width="1400" height="160" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="320" y="408" font-size="34" font-weight="600">Scaffold a project</text>
    <text x="320" y="462" font-size="30" font-family="Consolas, monospace">specify init &lt;PROJECT_NAME&gt; --integration copilot</text>
    <rect x="260" y="570" width="1400" height="160" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="320" y="638" font-size="34" font-weight="600">Pick the script flavour</text>
    <text x="320" y="692" font-size="30" fill="#57606a">Bash, PowerShell or Python</text>
    <rect x="260" y="800" width="1400" height="160" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="320" y="868" font-size="34" font-weight="600">Open the folder as the workspace</text>
    <text x="320" y="922" font-size="30" font-family="Consolas, monospace">.github/skills/speckit-&lt;cmd&gt;/SKILL.md</text>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="960" y1="270" x2="960" y2="332"/>
    <line x1="960" y1="500" x2="960" y2="562"/>
    <line x1="960" y1="730" x2="960" y2="792"/>
  </g>
</svg>
