<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="#24292f" text-anchor="middle">
    <rect x="70" y="200" width="660" height="220" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="400" y="300" font-size="30" font-family="Consolas, monospace">uv tool install specify-cli</text>
    <text x="400" y="354" font-size="28" fill="#57606a">older specify-cli present</text>
    <rect x="820" y="200" width="440" height="220" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1040" y="300" font-size="30" font-family="Consolas, monospace">Audited 16 packages</text>
    <text x="1040" y="354" font-size="28" fill="#57606a">installs nothing</text>
    <rect x="1350" y="200" width="500" height="220" rx="24" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1600" y="300" font-size="32" font-family="Consolas, monospace" fill="#c24141">/speckit.specify</text>
    <text x="1600" y="354" font-size="28" fill="#c24141">unknown to Copilot</text>
    <rect x="70" y="620" width="660" height="220" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="400" y="720" font-size="28" font-family="Consolas, monospace">uv tool install specify-cli --reinstall</text>
    <text x="400" y="774" font-size="28" fill="#57606a">replaces the old generation</text>
    <rect x="820" y="620" width="440" height="220" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1040" y="720" font-size="30" font-family="Consolas, monospace">specify 1.0.9</text>
    <text x="1040" y="774" font-size="26" font-family="Consolas, monospace" fill="#57606a">specify --version</text>
    <rect x="1350" y="620" width="500" height="220" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1600" y="720" font-size="32" font-family="Consolas, monospace">/speckit-specify</text>
    <text x="1600" y="774" font-size="26" font-family="Consolas, monospace" fill="#57606a">"invoke_separator": "-"</text>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="730" y1="310" x2="812" y2="310"/>
    <line x1="730" y1="730" x2="812" y2="730"/>
    <line x1="1260" y1="730" x2="1342" y2="730"/>
  </g>
  <line x1="1260" y1="310" x2="1342" y2="310" stroke="#c24141" stroke-width="4" marker-end="url(#r)"/>
  <line x1="70" y1="520" x2="1850" y2="520" stroke="#d0d7de" stroke-width="3" stroke-dasharray="14 10"/>
</svg>
