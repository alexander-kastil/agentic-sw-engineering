<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="#24292f">
    <rect x="100" y="110" width="620" height="240" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="410" y="195" text-anchor="middle" font-size="44" font-weight="600">VS Code</text>
    <rect x="140" y="235" width="540" height="66" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="410" y="279" text-anchor="middle" font-size="28" font-family="Consolas, monospace">.vscode/mcp.json</text>

    <rect x="1200" y="110" width="620" height="240" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1510" y="195" text-anchor="middle" font-size="44" font-weight="600">Copilot CLI</text>
    <rect x="1230" y="235" width="560" height="66" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1510" y="279" text-anchor="middle" font-size="28" font-family="Consolas, monospace">~/.copilot/mcp-config.json</text>

    <rect x="820" y="160" width="280" height="140" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="222" text-anchor="middle" font-size="32" font-weight="600" font-family="Consolas, monospace">mcp.json</text>
    <text x="960" y="265" text-anchor="middle" font-size="26" fill="#57606a">in the repo</text>
  </g>
  <line x1="820" y1="230" x2="728" y2="230" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1100" y1="230" x2="1192" y2="230" stroke="#c24141" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#r)"/>
  <g stroke="#c24141" stroke-width="7" stroke-linecap="round"><line x1="1128" y1="208" x2="1164" y2="252"/><line x1="1164" y1="208" x2="1128" y2="252"/></g>
  <rect x="1250" y="380" width="520" height="64" rx="32" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="1510" y="422" text-anchor="middle" font-size="28" font-weight="600" fill="#c24141">repo files never reach the CLI</text>
  <text x="1510" y="490" text-anchor="middle" font-size="26" fill="#57606a">register with copilot mcp add</text>
  <g stroke="#57606a" stroke-width="3" marker-end="url(#a)">
    <line x1="300" y1="350" x2="300" y2="700"/>
    <line x1="520" y1="350" x2="860" y2="700"/>
    <line x1="1400" y1="520" x2="560" y2="700"/>
    <line x1="1620" y1="520" x2="1070" y2="700"/>
  </g>
  <g fill="#24292f">
    <rect x="100" y="710" width="520" height="230" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="360" y="805" text-anchor="middle" font-size="40" font-weight="600">Local stdio</text>
    <text x="360" y="860" text-anchor="middle" font-size="28" fill="#57606a">npx, python, dotnet</text>
    <rect x="700" y="710" width="520" height="230" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="805" text-anchor="middle" font-size="40" font-weight="600">Remote HTTP</text>
    <text x="960" y="860" text-anchor="middle" font-size="28" fill="#57606a">hosted endpoint</text>
    <rect x="1300" y="710" width="520" height="230" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
    <text x="1560" y="805" text-anchor="middle" font-size="40" font-weight="600">MCP Registry</text>
    <text x="1560" y="860" text-anchor="middle" font-size="28" fill="#57606a">discover servers</text>
  </g>
