<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <line x1="960" y1="80" x2="960" y2="1000" stroke="#d0d7de" stroke-width="3"/>
  <g fill="#24292f">
    <rect x="80" y="70" width="820" height="110" rx="22" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="490" y="120" text-anchor="middle" font-size="36" font-weight="600">Orchestration</text>
    <text x="490" y="160" text-anchor="middle" font-size="28" fill="#57606a">dotnet-conventions</text>
    <rect x="1020" y="70" width="820" height="110" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1430" y="120" text-anchor="middle" font-size="36" font-weight="600">Deterministic</text>
    <text x="1430" y="160" text-anchor="middle" font-size="28" fill="#57606a">qr-batch</text>

    <rect x="330" y="230" width="320" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="490" y="287" text-anchor="middle" font-size="32">Request</text>
    <rect x="290" y="370" width="400" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="490" y="427" text-anchor="middle" font-size="32">SKILL.md router</text>
    <polygon points="490,510 620,590 490,670 360,590" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="490" y="600" text-anchor="middle" font-size="28">Which row?</text>
    <rect x="80" y="740" width="250" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="205" y="797" text-anchor="middle" font-size="26">controllers.md</text>
    <rect x="365" y="740" width="250" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="490" y="797" text-anchor="middle" font-size="26">efcore.md</text>
    <rect x="650" y="740" width="250" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="775" y="797" text-anchor="middle" font-size="26">msal-auth.md</text>
    <text x="490" y="920" text-anchor="middle" font-size="30" fill="#57606a">model applies judgement,</text>
    <text x="490" y="962" text-anchor="middle" font-size="30" fill="#57606a">varies by design</text>

    <rect x="1230" y="230" width="400" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1430" y="287" text-anchor="middle" font-size="32">Collect parameters</text>
    <rect x="1230" y="370" width="400" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1430" y="427" text-anchor="middle" font-size="30" font-family="Consolas, monospace">script --dry-run</text>
    <rect x="1230" y="510" width="400" height="90" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="1430" y="567" text-anchor="middle" font-size="32">Confirm</text>
    <rect x="1230" y="650" width="400" height="90" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1430" y="707" text-anchor="middle" font-size="32">Run for real</text>
    <rect x="1230" y="790" width="400" height="90" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1430" y="847" text-anchor="middle" font-size="30" font-family="Consolas, monospace">{ JSON result }</text>
    <text x="1430" y="962" text-anchor="middle" font-size="30" fill="#57606a">same output every run</text>
  </g>
  <g stroke="#57606a" stroke-width="3" marker-end="url(#a)">
