<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="120" y="70" width="1680" height="110" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="3"/>
  <text x="960" y="140" text-anchor="middle" font-size="42" font-weight="600" fill="#24292f">Context window</text>
  <g stroke="#57606a" fill="none" marker-end="url(#a)">
    <line x1="420" y1="290" x2="420" y2="186" stroke-width="10"/>
    <line x1="780" y1="490" x2="780" y2="186" stroke-width="6"/>
    <line x1="1140" y1="690" x2="1140" y2="186" stroke-width="3"/>
    <line x1="1500" y1="890" x2="1500" y2="186" stroke-width="5"/>
  </g>
  <g font-size="30" fill="#24292f">
    <rect x="120" y="290" width="1680" height="150" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="160" y="360" font-size="36" font-weight="600">Always on</text>
    <text x="160" y="405" font-size="26" fill="#57606a">every turn, every request</text>
    <rect x="560" y="325" width="560" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="840" y="376" text-anchor="middle">copilot-instructions.md ~1-2 KB</text>
    <rect x="1160" y="325" width="300" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1310" y="376" text-anchor="middle">AGENTS.md</text>

    <rect x="120" y="490" width="1680" height="150" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="160" y="560" font-size="36" font-weight="600">By file glob</text>
    <text x="160" y="605" font-size="26" fill="#57606a">applyTo matches the open file</text>
    <rect x="560" y="525" width="480" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="800" y="576" text-anchor="middle">angular.instructions.md</text>
    <rect x="1080" y="525" width="460" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1310" y="576" text-anchor="middle">dotnet.instructions.md</text>
    <text x="1580" y="576" font-size="26" fill="#57606a">0.5-2 KB each</text>

    <rect x="120" y="690" width="1680" height="150" rx="22" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="160" y="760" font-size="36" font-weight="600">By description</text>
    <text x="160" y="805" font-size="26" fill="#57606a">request matches a skill</text>
    <rect x="560" y="725" width="540" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="830" y="776" text-anchor="middle">skill metadata ~100 tokens each</text>
    <rect x="1140" y="725" width="520" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1400" y="776" text-anchor="middle">SKILL.md body &lt; 5000 tokens</text>

    <rect x="120" y="890" width="1680" height="150" rx="22" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="160" y="960" font-size="36" font-weight="600">By explicit choice</text>
    <text x="160" y="1005" font-size="26" fill="#57606a">you pick it</text>
    <rect x="560" y="925" width="300" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="710" y="976" text-anchor="middle">/prompt file</text>
    <rect x="900" y="925" width="320" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1060" y="976" text-anchor="middle">custom agent</text>
    <rect x="1260" y="925" width="380" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1450" y="976" text-anchor="middle">selected MCP tools</text>
  </g>
