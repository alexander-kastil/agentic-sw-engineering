<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="60" y="360" width="340" height="260" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="230" y="440" font-size="34" font-weight="600">Trigger</text>
    <text x="230" y="500" font-size="26" font-family="Consolas, monospace" fill="#57606a">push: main</text>
    <text x="230" y="545" font-size="26" font-family="Consolas, monospace" fill="#57606a">workflow_dispatch</text>

    <rect x="500" y="360" width="340" height="260" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="670" y="475" font-size="34" font-weight="600">Build job</text>
    <text x="670" y="528" font-size="26" font-family="Consolas, monospace" fill="#57606a">src/food-app</text>

    <rect x="960" y="280" width="480" height="420" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1200" y="350" font-size="34" font-weight="600">Deploy job</text>
    <g font-size="26" font-family="Consolas, monospace">
      <text x="1200" y="425">azure/login</text>
      <text x="1200" y="485">secrets.AZURE_CREDENTIALS</text>
      <text x="1200" y="545">vars.AZURE_RESOURCE_GROUP</text>
      <text x="1200" y="605">azd + infra/*.bicep</text>
    </g>

    <rect x="1560" y="400" width="300" height="180" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1710" y="480" font-size="36" font-weight="600">Azure</text>
    <text x="1710" y="530" font-size="28" fill="#57606a">food-app</text>
  </g>

  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="400" y1="490" x2="492" y2="490"/>
    <line x1="840" y1="490" x2="952" y2="490"/>
    <line x1="1440" y1="490" x2="1552" y2="490"/>
  </g>
  <text x="896" y="466" text-anchor="middle" font-size="28" font-weight="600" fill="#57606a">needs</text>

  <g text-anchor="middle" font-size="30" fill="#24292f">
    <rect x="160" y="810" width="740" height="84" rx="42" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="530" y="862">Every action pinned to a full commit SHA</text>
    <rect x="1020" y="810" width="740" height="84" rx="42" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1390" y="862">Minimum permissions per job</text>
  </g>
</svg>
