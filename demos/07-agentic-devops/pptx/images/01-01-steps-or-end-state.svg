<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="80" y="200" width="520" height="420" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="340" y="290" font-size="34" font-weight="600">Azure CLI script</text>
    <text x="340" y="360" font-size="26" font-family="Consolas, monospace" fill="#57606a">create-bindings-app.azcli</text>
    <text x="340" y="450" font-size="30">commands run</text>
    <text x="340" y="495" font-size="30">in order</text>

    <rect x="700" y="200" width="520" height="420" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="290" font-size="34" font-weight="600">SSH session</text>
    <text x="960" y="360" font-size="26" font-family="Consolas, monospace" fill="#57606a">ssh-mcp</text>
    <text x="960" y="450" font-size="30">agent applies config</text>
    <text x="960" y="495" font-size="30">to a host that is</text>
    <text x="960" y="540" font-size="30">already there</text>

    <rect x="1320" y="200" width="520" height="420" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1580" y="290" font-size="34" font-weight="600">Bicep and Terraform</text>
    <text x="1580" y="360" font-size="26" font-family="Consolas, monospace" fill="#57606a">main.bicep   main.tf</text>
    <text x="1580" y="450" font-size="30">you write the end state,</text>
    <text x="1580" y="495" font-size="30">the engine works out</text>
    <text x="1580" y="540" font-size="30">the steps</text>
  </g>

  <g stroke="#8c959f" stroke-width="2" stroke-dasharray="6 6">
    <line x1="340" y1="620" x2="340" y2="724"/>
    <line x1="960" y1="620" x2="960" y2="724"/>
    <line x1="1580" y1="620" x2="1580" y2="724"/>
  </g>

  <line x1="80" y1="740" x2="1832" y2="740" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
  <circle cx="340" cy="740" r="14" fill="#eaf2ff" stroke="#57606a" stroke-width="3"/>
  <circle cx="960" cy="740" r="14" fill="#fff6e5" stroke="#57606a" stroke-width="3"/>
  <circle cx="1580" cy="740" r="14" fill="#e9f7ef" stroke="#57606a" stroke-width="3"/>

  <g font-size="30" font-weight="600" fill="#57606a">
    <text x="80" y="820">Imperative: the steps</text>
    <text x="1840" y="820" text-anchor="end">Declarative: the end state</text>
  </g>
</svg>
