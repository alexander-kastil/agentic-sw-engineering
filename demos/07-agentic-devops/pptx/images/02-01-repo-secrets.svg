<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="60" y="200" width="380" height="240" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="250" y="305" font-size="32" font-weight="700" font-family="Consolas, monospace">gh secret set</text>
    <text x="250" y="360" font-size="26" font-family="Consolas, monospace" fill="#57606a">--body  stdin  file</text>

    <rect x="520" y="200" width="380" height="240" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="710" y="305" font-size="32" font-weight="600">Repository secret</text>
    <text x="710" y="360" font-size="28" fill="#57606a">write-only</text>

    <rect x="980" y="200" width="380" height="240" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1170" y="305" font-size="32" font-weight="600">Workflow job</text>
    <text x="1170" y="360" font-size="26" font-family="Consolas, monospace" fill="#57606a">environment: production</text>

    <rect x="1440" y="200" width="380" height="240" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1630" y="305" font-size="30" font-weight="700" font-family="Consolas, monospace">secrets.API_KEY</text>
    <text x="1630" y="360" font-size="28" fill="#57606a">only where needed</text>
  </g>

  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="440" y1="320" x2="512" y2="320"/>
    <line x1="900" y1="320" x2="972" y2="320"/>
    <line x1="1360" y1="320" x2="1432" y2="320"/>
  </g>

  <g text-anchor="middle">
    <rect x="60" y="560" width="560" height="250" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="340" y="630" font-size="32" font-weight="600" fill="#24292f">Write-only once set</text>
    <text x="340" y="690" font-size="28" font-family="Consolas, monospace" fill="#24292f">gh secret list</text>
    <text x="340" y="740" font-size="28" fill="#57606a">shows names, never values</text>

    <rect x="680" y="560" width="560" height="250" rx="22" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="630" font-size="32" font-weight="600" fill="#24292f">Masked only verbatim</text>
    <text x="960" y="690" font-size="28" fill="#57606a">base64 or JSON-embedded</text>
    <text x="960" y="740" font-size="28" fill="#57606a">prints in the clear</text>

    <rect x="1300" y="560" width="560" height="250" rx="22" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1580" y="630" font-size="32" font-weight="600" fill="#c24141">Dependabot cannot see them</text>
    <text x="1580" y="690" font-size="28" fill="#57606a">set it again with</text>
    <text x="1580" y="740" font-size="28" font-family="Consolas, monospace" fill="#24292f">--app dependabot</text>
  </g>

  <text x="960" y="930" text-anchor="middle" font-size="28" fill="#57606a">Credentials as secrets; resource group and region as variables in <tspan font-family="Consolas, monospace" fill="#24292f">vars</tspan></text>
</svg>
