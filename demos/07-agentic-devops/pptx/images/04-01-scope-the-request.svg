<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="620" y="110" font-size="28" fill="#57606a">how much the agent reads</text>

  <g text-anchor="middle" fill="#24292f">
    <rect x="80" y="140" width="480" height="180" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="320" y="222" font-size="36" font-weight="700" font-family="Consolas, monospace">#selection</text>
    <text x="320" y="272" font-size="28" fill="#57606a">highlighted lines</text>

    <rect x="80" y="390" width="480" height="180" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="320" y="472" font-size="36" font-weight="700" font-family="Consolas, monospace">#file:  #editor</text>
    <text x="320" y="522" font-size="28" fill="#57606a">one file, open files</text>

    <rect x="80" y="640" width="480" height="180" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="320" y="722" font-size="36" font-weight="700" font-family="Consolas, monospace">@workspace</text>
    <text x="320" y="772" font-size="28" fill="#57606a">whole repository, indexed</text>
  </g>

  <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
    <rect x="620" y="195" width="160" height="70" rx="12"/>
    <rect x="620" y="445" width="380" height="70" rx="12"/>
    <rect x="620" y="695" width="600" height="70" rx="12"/>
  </g>

  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="788" y1="230" x2="1332" y2="230"/>
    <line x1="1008" y1="480" x2="1332" y2="480"/>
    <line x1="1228" y1="730" x2="1332" y2="730"/>
  </g>

  <g text-anchor="middle" font-size="32" font-weight="600" fill="#24292f">
    <rect x="1340" y="160" width="500" height="140" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1590" y="241">Inline documentation</text>
    <rect x="1340" y="410" width="500" height="140" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1590" y="491">API reference</text>
    <rect x="1340" y="660" width="500" height="140" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1590" y="741">Repository README</text>
  </g>

  <rect x="460" y="900" width="1000" height="90" rx="45" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="960" y="956" text-anchor="middle" font-size="30" fill="#24292f">Start narrow, widen only when the answer is thin</text>
</svg>
