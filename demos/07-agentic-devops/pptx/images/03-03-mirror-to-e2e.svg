<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g text-anchor="middle" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#24292f">
    <rect x="160" y="110" width="700" height="100" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="510" y="172">app.spec.ts</text>
    <rect x="1060" y="110" width="700" height="100" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="172">app.e2e.spec.ts</text>
  </g>

  <g text-anchor="middle" font-size="30" fill="#24292f">
    <rect x="160" y="260" width="700" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="510" y="331">query by CSS selector</text>
    <rect x="1060" y="260" width="700" height="120" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="331" font-family="Consolas, monospace">page.getByRole(...)</text>

    <rect x="160" y="420" width="700" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="510" y="491">call component methods</text>
    <rect x="1060" y="420" width="700" height="120" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="491" font-family="Consolas, monospace">button.click()</text>

    <rect x="160" y="580" width="700" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="510" y="651" font-family="Consolas, monospace">await fixture.whenStable()</text>
    <rect x="1060" y="580" width="700" height="120" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="651" font-family="Consolas, monospace">await expect(...)</text>
  </g>

  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="860" y1="320" x2="1052" y2="320"/>
    <line x1="860" y1="480" x2="1052" y2="480"/>
    <line x1="860" y1="640" x2="1052" y2="640"/>
  </g>

  <rect x="160" y="790" width="1600" height="160" rx="22" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="960" y="855" text-anchor="middle" font-size="32" font-weight="600" fill="#24292f">Same test names in both files</text>
  <text x="960" y="910" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#57606a">'increments count on button click'</text>
</svg>
