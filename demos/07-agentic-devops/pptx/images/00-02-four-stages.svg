  </g>

  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="460" y1="450" x2="512" y2="450"/>
    <line x1="920" y1="450" x2="972" y2="450"/>
    <line x1="1380" y1="450" x2="1432" y2="450"/>
  </g>

  <g stroke="#8c959f" stroke-width="2" stroke-dasharray="6 6">
