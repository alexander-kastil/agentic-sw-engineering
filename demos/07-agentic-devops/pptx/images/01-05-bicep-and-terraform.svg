  <text x="1190" y="935" text-anchor="middle" font-size="28" fill="#57606a"><tspan font-family="Consolas, monospace">azure.yaml</tspan> picks the engine; Bicep is the default</text>
  <rect x="890" y="960" width="600" height="70" rx="35" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1190" y="1005" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">infra: provider: terraform</text>
