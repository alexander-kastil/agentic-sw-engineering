<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="560" y="70" width="800" height="120" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="143" font-size="34" font-weight="600" font-family="Consolas, monospace">workiq get-schema /me/sendMail</text>
    <polygon points="960,270 1210,390 960,510 710,390" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="960" y="382" font-size="30" font-weight="600">Schema or</text>
    <text x="960" y="420" font-size="30" font-weight="600">access denied?</text>
    <rect x="90" y="700" width="520" height="260" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="350" y="775" font-size="36" font-weight="600">Option A</text>
    <text x="350" y="830" font-size="28" font-family="Consolas, monospace">work-iq do_action</text>
    <text x="350" y="880" font-size="26" fill="#57606a">Mail.Send consent</text>
    <text x="350" y="916" font-size="26" fill="#57606a">plus admin allowlist</text>
    <rect x="700" y="700" width="520" height="260" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="775" font-size="36" font-weight="600">Option B</text>
    <text x="960" y="830" font-size="28" font-family="Consolas, monospace">Send-MgUserMail</text>
    <text x="960" y="880" font-size="26" fill="#57606a">Graph PowerShell SDK</text>
    <text x="960" y="916" font-size="26" fill="#57606a">its own consent</text>
    <rect x="1310" y="700" width="520" height="260" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1570" y="775" font-size="36" font-weight="600">Option C</text>
    <text x="1570" y="830" font-size="28">Power Automate flow</text>
    <text x="1570" y="880" font-size="26" fill="#57606a">the CLI calls its URL</text>
    <text x="1570" y="916" font-size="26" fill="#57606a">with curl</text>
  </g>
  <g font-size="26" fill="#57606a">
    <text x="372" y="560">schema, and</text><text x="372" y="596">you are admin</text>
    <text x="982" y="610">access denied</text>
    <text x="1548" y="560" text-anchor="end">no admin,</text><text x="1548" y="596" text-anchor="end">no workstation</text>
  </g>
  <g stroke="#57606a" stroke-width="4" fill="none" marker-end="url(#a)">
    <line x1="960" y1="190" x2="960" y2="262"/>
    <polyline points="710,390 350,390 350,692"/>
    <line x1="960" y1="510" x2="960" y2="692"/>
    <polyline points="1210,390 1570,390 1570,692"/>
  </g>
</svg>
