<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="80" y="120" width="680" height="200" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="420" y="208" font-size="34" font-weight="600" font-family="Consolas, monospace">.vscode/mcp.json</text>
    <text x="420" y="260" font-size="28" fill="#57606a">MCP servers, key: servers</text>
    <rect x="80" y="420" width="680" height="200" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="420" y="508" font-size="34" font-weight="600" font-family="Consolas, monospace">.github/skills/</text>
    <text x="420" y="560" font-size="28" fill="#57606a">skills, shared by both hosts</text>
    <rect x="80" y="720" width="680" height="200" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="420" y="808" font-size="34" font-weight="600" font-family="Consolas, monospace">~/.copilot/mcp-config.json</text>
    <text x="420" y="860" font-size="28" fill="#57606a">written by copilot mcp add</text>
    <rect x="1260" y="140" width="580" height="280" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1550" y="275" font-size="44" font-weight="600">VS Code</text>
    <text x="1550" y="330" font-size="28" fill="#57606a">editor agent</text>
    <rect x="1260" y="640" width="580" height="280" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1550" y="775" font-size="44" font-weight="600">Copilot CLI</text>
    <text x="1550" y="830" font-size="28" fill="#57606a"><tspan font-family="Consolas, monospace">/mcp</tspan>  ·  <tspan font-family="Consolas, monospace">/skills</tspan>  ·  <tspan font-family="Consolas, monospace">/env</tspan></text>
    <text x="960" y="1020" font-size="28" fill="#57606a">An Agent Plugin carries <tspan font-family="Consolas, monospace" fill="#24292f">skills/</tspan> and <tspan font-family="Consolas, monospace" fill="#24292f">mcp.json</tspan> to both hosts</text>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="760" y1="220" x2="1252" y2="250"/>
    <line x1="760" y1="495" x2="1252" y2="360"/>
    <line x1="760" y1="545" x2="1252" y2="700"/>
    <line x1="760" y1="820" x2="1252" y2="800"/>
