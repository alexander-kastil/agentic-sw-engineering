<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="80" y="400" width="280" height="240" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="220" y="505" font-size="32" font-weight="600">Model wants</text>
    <text x="220" y="550" font-size="32" font-weight="600">a tool</text>
    <polygon points="640,390 840,520 640,650 440,520" fill="#eaf2ff" stroke="#8c959f" stroke-width="3"/>
    <text x="640" y="512" font-size="34" font-weight="600">Visible?</text>
    <text x="640" y="556" font-size="26" font-family="Consolas, monospace">availableTools</text>
    <polygon points="1160,390 1360,520 1160,650 960,520" fill="#f3edff" stroke="#8c959f" stroke-width="3"/>
    <text x="1160" y="512" font-size="34" font-weight="600">Permitted?</text>
    <text x="1160" y="556" font-size="26" font-family="Consolas, monospace">skipPermission</text>
    <rect x="1480" y="400" width="360" height="240" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1660" y="505" font-size="32" font-weight="600">Your handler</text>
    <text x="1660" y="550" font-size="32" font-weight="600">runs</text>
    <rect x="460" y="800" width="360" height="130" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
    <text x="640" y="878" font-size="32" font-weight="600" fill="#57606a">Never offered</text>
    <rect x="980" y="800" width="360" height="130" rx="24" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1160" y="878" font-size="32" font-weight="600" fill="#c24141">Call denied</text>
    <text x="640" y="250" font-size="28" fill="#57606a"><tspan font-family="Consolas, monospace">builtin:*  mcp:*  custom:*</tspan></text>
    <text x="1160" y="250" font-size="28" fill="#57606a">or <tspan font-family="Consolas, monospace">onPermissionRequest</tspan></text>
  </g>
  <g font-size="28" font-weight="600" fill="#57606a">
    <text x="896" y="498" text-anchor="middle">yes</text>
    <text x="1418" y="498" text-anchor="middle">yes</text>
    <text x="662" y="735">no</text>
    <text x="1182" y="735">no</text>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="360" y1="520" x2="432" y2="520"/>
    <line x1="840" y1="520" x2="952" y2="520"/>
    <line x1="1360" y1="520" x2="1472" y2="520"/>
    <line x1="640" y1="650" x2="640" y2="792"/>
  </g>
  <line x1="1160" y1="650" x2="1160" y2="792" stroke="#c24141" stroke-width="4" marker-end="url(#r)"/>
  <line x1="640" y1="290" x2="640" y2="382" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1160" y1="290" x2="1160" y2="382" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
