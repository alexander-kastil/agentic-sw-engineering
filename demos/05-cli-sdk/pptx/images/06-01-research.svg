<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="360" y="100" width="240" height="90" rx="45" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="480" y="157" font-size="28">codebase</text>
    <rect x="630" y="100" width="300" height="90" rx="45" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="780" y="157" font-size="28">GitHub search</text>
    <rect x="960" y="100" width="200" height="90" rx="45" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1060" y="157" font-size="28">web</text>

    <rect x="90" y="400" width="300" height="260" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="240" y="512" font-size="32" font-weight="600">You run</text>
    <text x="240" y="562" font-size="32" font-weight="600" font-family="Consolas, monospace">/research</text>
    <rect x="570" y="400" width="420" height="260" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="780" y="512" font-size="32" font-weight="600">Agent reads</text>
    <text x="780" y="562" font-size="26" fill="#57606a">every source read-only</text>
    <rect x="1070" y="400" width="300" height="260" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="512" font-size="32" font-weight="600">Cited</text>
    <text x="1220" y="562" font-size="32" font-weight="600">report</text>
    <rect x="1530" y="400" width="300" height="260" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="1680" y="512" font-size="32" font-weight="600">You verify</text>
    <text x="1680" y="562" font-size="26" fill="#57606a">the citations</text>

    <rect x="530" y="780" width="500" height="72" rx="36" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="780" y="827" font-size="28" font-weight="600">no edits, no approval prompt</text>
    <text x="1680" y="760" font-size="26" fill="#57606a">refine once, compare</text>
    <text x="1680" y="796" font-size="26" fill="#57606a">the second answer</text>
    <text x="960" y="990" font-size="28" fill="#57606a"><tspan font-family="Consolas, monospace" fill="#24292f">/share</tspan> keeps the report as a scoping artifact for an issue or a PR</text>
  </g>
  <g stroke="#57606a" stroke-width="4" fill="none" marker-end="url(#a)">
    <line x1="480" y1="190" x2="690" y2="392"/>
    <line x1="780" y1="190" x2="780" y2="392"/>
    <line x1="1060" y1="190" x2="870" y2="392"/>
    <line x1="390" y1="530" x2="562" y2="530"/>
    <line x1="990" y1="530" x2="1062" y2="530"/>
    <line x1="1370" y1="530" x2="1522" y2="530"/>
  </g>
</svg>
