<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g fill="#24292f" text-anchor="middle">
    <rect x="90" y="260" width="300" height="280" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="240" y="390" font-size="34" font-weight="600">Copilot CLI</text>
    <text x="240" y="438" font-size="26" fill="#57606a">one prompt</text>
    <rect x="450" y="260" width="300" height="280" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="600" y="370" font-size="34" font-weight="600">Work IQ MCP</text>
    <text x="600" y="420" font-size="26" fill="#57606a">Graph as the</text>
    <text x="600" y="456" font-size="26" fill="#57606a">signed-in user</text>
    <rect x="810" y="260" width="300" height="280" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="370" font-size="34" font-weight="600">HR-Documents</text>
    <text x="960" y="420" font-size="26" fill="#57606a">Needs Update</text>
    <text x="960" y="456" font-size="26" fill="#57606a">flagged</text>
    <rect x="1170" y="260" width="300" height="280" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1320" y="370" font-size="34" font-weight="600">Report</text>
    <text x="1320" y="420" font-size="26" fill="#57606a">name, modified,</text>
    <text x="1320" y="456" font-size="26" fill="#57606a">modified by</text>
