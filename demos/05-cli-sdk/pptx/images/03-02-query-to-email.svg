    <text x="1680" y="420" font-size="26" fill="#57606a">to HR</text>
    <text x="1680" y="456" font-size="26" fill="#57606a">leadership</text>
    <rect x="450" y="680" width="660" height="110" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
    <text x="780" y="747" font-size="28" font-family="Consolas, monospace">search_paths  ·  fetch  ·  $expand=fields</text>
    <rect x="330" y="880" width="1260" height="72" rx="36" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="927" font-size="28" font-weight="600"><tspan font-family="Consolas, monospace">NeedsUpdate</tspan> is not indexed: the agent filters the items itself</text>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
