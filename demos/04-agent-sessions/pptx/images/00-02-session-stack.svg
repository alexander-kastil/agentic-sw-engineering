<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="#24292f" text-anchor="middle">
    <rect x="100" y="80" width="1520" height="200" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="860" y="165" font-size="44" font-weight="600">Agents window</text>
    <text x="860" y="220" font-size="30" fill="#57606a">companion window · harness chip · per-window overrides</text>

    <rect x="100" y="320" width="1520" height="200" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="860" y="405" font-size="44" font-weight="600">Session management</text>
    <text x="860" y="460" font-size="30" fill="#57606a">layout · groups · banners · /chronicle · /troubleshoot</text>

    <rect x="100" y="560" width="1520" height="200" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="860" y="645" font-size="44" font-weight="600">Agent host (AHP)</text>
