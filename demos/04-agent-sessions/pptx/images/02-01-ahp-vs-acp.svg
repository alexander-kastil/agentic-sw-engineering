<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="80" y="50" width="840" height="660" rx="28" fill="#fffafa" stroke="#c24141" stroke-width="2"/>
  <rect x="1000" y="50" width="840" height="660" rx="28" fill="#f7fcf9" stroke="#2f7d4f" stroke-width="2"/>
  <g fill="#24292f" text-anchor="middle">
    <text x="500" y="125" font-size="44" font-weight="600">ACP</text>
    <text x="500" y="170" font-size="28" fill="#57606a">Agent Client Protocol</text>
    <rect x="180" y="220" width="640" height="200" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="500" y="290" font-size="38" font-weight="600">Client</text>
    <rect x="330" y="320" width="340" height="70" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="500" y="366" font-size="28">session state</text>

    <text x="1420" y="125" font-size="44" font-weight="600">AHP</text>
    <text x="1420" y="170" font-size="28" fill="#57606a">Agent Host Protocol</text>
    <rect x="1100" y="220" width="640" height="200" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1420" y="290" font-size="38" font-weight="600">Long-lived host</text>
    <rect x="1250" y="320" width="340" height="70" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1420" y="366" font-size="28">session state</text>
    <rect x="1100" y="490" width="300" height="100" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1250" y="552" font-size="30" font-weight="600">Client view</text>
    <rect x="1440" y="490" width="300" height="100" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1590" y="552" font-size="30" font-weight="600">Client view</text>
  </g>
  <line x1="500" y1="420" x2="500" y2="600" stroke="#c24141" stroke-width="4" stroke-dasharray="12 8"/>
  <g stroke="#c24141" stroke-width="7" stroke-linecap="round"><line x1="480" y1="490" x2="520" y2="530"/><line x1="520" y1="490" x2="480" y2="530"/></g>
  <text x="545" y="522" font-size="28" fill="#c24141">client closes</text>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="1250" y1="420" x2="1250" y2="482"/>
    <line x1="1590" y1="420" x2="1590" y2="482"/>
  </g>
  <rect x="270" y="610" width="460" height="68" rx="34" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="500" y="654" text-anchor="middle" font-size="28" font-weight="600" fill="#c24141">running work at risk</text>
  <rect x="1190" y="610" width="460" height="68" rx="34" fill="#e9f7ef" stroke="#2f7d4f" stroke-width="2"/>
  <text x="1420" y="654" text-anchor="middle" font-size="28" font-weight="600" fill="#2f7d4f">session survives</text>
  <g font-size="30" fill="#24292f" text-anchor="middle">
    <rect x="80" y="750" width="840" height="80" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="500" y="801">state lives with the client</text>
    <rect x="1000" y="750" width="840" height="80" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1420" y="801">state lives on the host</text>
    <rect x="80" y="850" width="840" height="80" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="500" y="901">lifetime bound to the client</text>
    <rect x="1000" y="850" width="840" height="80" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1420" y="901">host outlives every client</text>
    <rect x="80" y="950" width="840" height="80" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="500" y="1001">typically one viewer</text>
    <rect x="1000" y="950" width="840" height="80" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1420" y="1001">one or more viewers</text>
  </g>
</svg>
