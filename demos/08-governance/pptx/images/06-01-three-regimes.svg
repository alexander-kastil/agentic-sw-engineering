<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="#24292f">
    <rect x="80" y="80" width="560" height="720" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="360" y="160" font-size="38" font-weight="600" text-anchor="middle">EU AI Act</text>
    <line x1="120" y1="200" x2="600" y2="200" stroke="#8c959f" stroke-width="2"/>
    <text x="120" y="260" font-size="26" font-weight="600" fill="#57606a">APPLIES WHEN</text>
    <text x="120" y="310" font-size="28">A person interacts with</text>
    <text x="120" y="350" font-size="28">the AI, or it decides</text>
    <text x="120" y="390" font-size="28">something about a person</text>
    <text x="120" y="490" font-size="26" font-weight="600" fill="#57606a">CORE OBLIGATION</text>
    <text x="120" y="540" font-size="28">Classify the risk tier,</text>
    <text x="120" y="580" font-size="28">then disclose AI use</text>
    <text x="120" y="620" font-size="28">(Article 50)</text>

    <rect x="680" y="80" width="560" height="720" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="160" font-size="38" font-weight="600" text-anchor="middle">DSGVO / GDPR</text>
    <line x1="720" y1="200" x2="1200" y2="200" stroke="#8c959f" stroke-width="2"/>
    <text x="720" y="260" font-size="26" font-weight="600" fill="#57606a">APPLIES WHEN</text>
    <text x="720" y="310" font-size="28">A feature collects, stores,</text>
    <text x="720" y="350" font-size="28">transmits or displays personal</text>
    <text x="720" y="390" font-size="28">data of people in the EU/EEA</text>
    <text x="720" y="490" font-size="26" font-weight="600" fill="#57606a">CORE OBLIGATION</text>
    <text x="720" y="540" font-size="28">Lawful basis, data-subject</text>
    <text x="720" y="580" font-size="28">rights, privacy notice,</text>
    <text x="720" y="620" font-size="28">processor agreements</text>

    <rect x="1280" y="80" width="560" height="720" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1560" y="160" font-size="38" font-weight="600" text-anchor="middle">Accessibility</text>
    <line x1="1320" y1="200" x2="1800" y2="200" stroke="#8c959f" stroke-width="2"/>
    <text x="1320" y="260" font-size="26" font-weight="600" fill="#57606a">APPLIES WHEN</text>
    <text x="1320" y="310" font-size="28">You ship a customer-facing</text>
    <text x="1320" y="350" font-size="28">website or app</text>
    <text x="1320" y="490" font-size="26" font-weight="600" fill="#57606a">CORE OBLIGATION</text>
    <text x="1320" y="540" font-size="28">Meet WCAG 2.1 AA as the</text>
    <text x="1320" y="580" font-size="28">defensible baseline</text>
    <text x="1320" y="620" font-size="28">(EAA, from 28 June 2025)</text>
  </g>
  <rect x="80" y="860" width="1760" height="120" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="931" font-size="30" fill="#24292f" text-anchor="middle">Engineering orientation, not legal advice: counsel or your DPO signs off any external claim</text>
</svg>
