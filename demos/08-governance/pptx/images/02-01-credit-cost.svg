<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="#24292f">
    <rect x="80" y="100" width="680" height="150" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="120" y="165" font-size="34" font-weight="600">Input tokens</text>
    <text x="120" y="212" font-size="28" fill="#57606a">the prompt and context you send</text>
    <rect x="80" y="290" width="680" height="150" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="120" y="355" font-size="34" font-weight="600">Output tokens</text>
    <text x="120" y="402" font-size="28" fill="#57606a">what the model generates</text>
    <rect x="80" y="480" width="680" height="150" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="120" y="545" font-size="34" font-weight="600">Cached tokens</text>
    <text x="120" y="592" font-size="28" fill="#57606a">cache read and cache write rates</text>
    <rect x="80" y="670" width="680" height="150" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="5"/>
    <text x="120" y="735" font-size="34" font-weight="600">Model rate</text>
    <text x="120" y="782" font-size="28" fill="#57606a">the per-model price per token</text>

    <rect x="1160" y="330" width="640" height="260" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1480" y="430" font-size="44" font-weight="600" text-anchor="middle">Credit cost</text>
    <text x="1480" y="484" font-size="44" font-weight="600" text-anchor="middle">of a turn</text>
    <text x="1480" y="540" font-size="28" fill="#57606a" text-anchor="middle">drawn from your AI credit balance</text>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="760" y1="175" x2="1152" y2="380"/>
    <line x1="760" y1="365" x2="1152" y2="440"/>
    <line x1="760" y1="555" x2="1152" y2="490"/>
    <line x1="760" y1="745" x2="1152" y2="545"/>
  </g>
  <text x="960" y="930" font-size="28" fill="#57606a" text-anchor="middle">Token counts grow with context and answer length; the model rate is the largest lever you control</text>
</svg>
