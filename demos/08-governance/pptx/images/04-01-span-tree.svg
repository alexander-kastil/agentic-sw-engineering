<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g text-anchor="middle" fill="#24292f">
    <rect x="640" y="100" width="640" height="150" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="170" font-size="36" font-weight="600" font-family="Consolas, monospace">invoke_agent &lt;agent&gt;</text>
    <text x="960" y="218" font-size="28" fill="#57606a">root span</text>

    <rect x="110" y="420" width="380" height="160" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="300" y="492" font-size="34" font-weight="600" font-family="Consolas, monospace">chat</text>
    <text x="300" y="540" font-size="28" fill="#57606a">a model turn</text>
    <rect x="550" y="420" width="380" height="160" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="740" y="492" font-size="34" font-weight="600" font-family="Consolas, monospace">execute_tool</text>
    <text x="740" y="540" font-size="28" fill="#57606a">a tool call</text>
    <rect x="990" y="420" width="380" height="160" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1180" y="492" font-size="34" font-weight="600" font-family="Consolas, monospace">execute_hook</text>
    <text x="1180" y="540" font-size="28" fill="#57606a">a hook run</text>
    <rect x="1430" y="420" width="380" height="160" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1620" y="492" font-size="34" font-weight="600" font-family="Consolas, monospace">embeddings</text>
    <text x="1620" y="540" font-size="28" fill="#57606a">an embedding request</text>

    <rect x="550" y="760" width="380" height="150" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
    <text x="740" y="848" font-size="34" font-weight="600">subagent spans</text>
  </g>
  <text x="980" y="848" font-size="28" fill="#57606a">parented to the <tspan font-family="Consolas, monospace">execute_tool</tspan> span that spawned it</text>
  <g stroke="#57606a" stroke-width="4" fill="none">
    <line x1="960" y1="250" x2="960" y2="330"/>
    <line x1="300" y1="330" x2="1620" y2="330"/>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="300" y1="330" x2="300" y2="412"/>
    <line x1="740" y1="330" x2="740" y2="412"/>
    <line x1="1180" y1="330" x2="1180" y2="412"/>
    <line x1="1620" y1="330" x2="1620" y2="412"/>
    <line x1="740" y1="580" x2="740" y2="752"/>
  </g>
</svg>
