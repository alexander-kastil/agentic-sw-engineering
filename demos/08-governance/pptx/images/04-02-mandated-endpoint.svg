<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g text-anchor="middle" fill="#24292f">
    <rect x="80" y="420" width="360" height="220" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="260" y="518" font-size="36" font-weight="600">Agent host</text>
    <text x="260" y="566" font-size="28" fill="#57606a">emits spans</text>

    <rect x="620" y="110" width="560" height="230" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="900" y="180" font-size="34" font-weight="600">Local SQLite</text>
    <text x="900" y="232" font-size="26" fill="#57606a" font-family="Consolas, monospace">otel.dbSpanExporter.enabled</text>
    <text x="900" y="290" font-size="26" fill="#57606a">Export Agent Host Traces Database...</text>

    <rect x="620" y="640" width="560" height="230" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="900" y="710" font-size="34" font-weight="600">OTLP exporter</text>
    <text x="900" y="764" font-size="26" fill="#57606a" font-family="Consolas, monospace">otlp-http  otlp-grpc</text>
    <text x="900" y="812" font-size="26" fill="#57606a" font-family="Consolas, monospace">console  file</text>

    <rect x="1340" y="660" width="500" height="190" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1590" y="742" font-size="34" font-weight="600">Collector or</text>
    <text x="1590" y="790" font-size="34" font-weight="600">Azure Managed Grafana</text>

    <rect x="1340" y="110" width="500" height="290" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="1590" y="180" font-size="28" font-weight="600" font-family="Consolas, monospace">managed-settings.json</text>
    <text x="1590" y="226" font-size="30" font-weight="600">telemetry block</text>
    <text x="1590" y="290" font-size="26" fill="#57606a" font-family="Consolas, monospace">enabled  endpoint</text>
    <text x="1590" y="336" font-size="26" fill="#57606a" font-family="Consolas, monospace">protocol  headers</text>
  </g>
  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="440" y1="480" x2="612" y2="260"/>
    <line x1="440" y1="580" x2="612" y2="740"/>
    <line x1="1180" y1="755" x2="1332" y2="755"/>
  </g>
  <line x1="1590" y1="400" x2="1590" y2="652" stroke="#e0a534" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#m)"/>
  <text x="1570" y="520" font-size="28" fill="#57606a" text-anchor="end">policy value</text>
  <text x="1570" y="558" font-size="28" fill="#57606a" text-anchor="end">pins the endpoint</text>
  <text x="400" y="355" font-size="28" fill="#57606a" text-anchor="middle">both at once</text>
  <rect x="620" y="930" width="1220" height="90" rx="24" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="1230" y="987" font-size="28" fill="#24292f" text-anchor="middle"><tspan font-family="Consolas, monospace" font-weight="600" fill="#c24141">captureContent</tspan> puts prompts and responses in spans: keep it off for shared sinks</text>
</svg>
