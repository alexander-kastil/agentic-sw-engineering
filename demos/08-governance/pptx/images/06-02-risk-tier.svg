<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="60" y="110" width="520" height="150" rx="24" fill="#fdecec" stroke="#c24141" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="320" y="175" font-size="32" font-weight="600" fill="#c24141" text-anchor="middle">Prohibited (Art. 5)</text>
  <text x="320" y="222" font-size="26" fill="#57606a" text-anchor="middle">social scoring, manipulation</text>
  <text x="640" y="175" font-size="28" fill="#57606a">Walk the tiers in order and stop at the first match:</text>
  <text x="640" y="217" font-size="28" fill="#57606a">prohibited practices are banned outright</text>

  <g text-anchor="middle" fill="#24292f">
    <rect x="60" y="470" width="220" height="140" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="170" y="552" font-size="32" font-weight="600">AI feature</text>

    <polygon points="600,390 840,540 600,690 360,540" fill="#eaf2ff" stroke="#8c959f" stroke-width="3"/>
    <text x="600" y="532" font-size="28" font-weight="600">Autonomous decision</text>
    <text x="600" y="568" font-size="28" font-weight="600">about a person?</text>

    <polygon points="1300,390 1540,540 1300,690 1060,540" fill="#eaf2ff" stroke="#8c959f" stroke-width="3"/>
    <text x="1300" y="532" font-size="28" font-weight="600">User-facing chat or</text>
    <text x="1300" y="568" font-size="28" font-weight="600">generated content?</text>

    <rect x="420" y="800" width="360" height="150" rx="24" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="600" y="866" font-size="32" font-weight="600">High-risk</text>
    <text x="600" y="910" font-size="28" fill="#57606a">(Annex III)</text>

    <rect x="1620" y="400" width="260" height="280" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="5"/>
    <text x="1750" y="500" font-size="30" font-weight="600">Limited-risk</text>
    <text x="1750" y="542" font-size="30" font-weight="600">transparency</text>
    <text x="1750" y="590" font-size="28" fill="#57606a">(Art. 50)</text>

    <rect x="1120" y="800" width="360" height="150" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1300" y="886" font-size="32" font-weight="600">Minimal risk</text>
  </g>
  <text x="1880" y="730" font-size="26" fill="#57606a" text-anchor="end">where most business apps land</text>

  <g stroke="#57606a" stroke-width="4" marker-end="url(#a)">
    <line x1="280" y1="540" x2="352" y2="540"/>
    <line x1="840" y1="540" x2="1052" y2="540"/>
    <line x1="1540" y1="540" x2="1612" y2="540"/>
    <line x1="1300" y1="690" x2="1300" y2="792"/>
  </g>
  <line x1="600" y1="690" x2="600" y2="792" stroke="#c24141" stroke-width="4" marker-end="url(#r)"/>
  <g font-size="26" font-weight="600" fill="#57606a">
    <text x="620" y="752">Yes, no human review</text>
    <text x="946" y="486" text-anchor="middle">No, or</text>
    <text x="946" y="520" text-anchor="middle">human confirms</text>
    <text x="1578" y="516" text-anchor="middle">Yes</text>
    <text x="1320" y="752">No</text>
  </g>
</svg>
