<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g text-anchor="middle" fill="#24292f">
    <rect x="80" y="90" width="540" height="320" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="350" y="175" font-size="28" font-weight="600" font-family="Consolas, monospace">chat.agent.sandbox</text>
    <text x="350" y="215" font-size="28" font-weight="600" font-family="Consolas, monospace">.enabled / .enabledWindows</text>
    <text x="350" y="290" font-size="34" font-weight="600">default: off</text>
    <text x="350" y="345" font-size="26" fill="#57606a">the switch, set per platform</text>

    <rect x="690" y="90" width="540" height="320" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="195" font-size="32" font-weight="600" font-family="Consolas, monospace">allowNetwork</text>
    <text x="960" y="290" font-size="34" font-weight="600">default: true</text>
    <text x="960" y="345" font-size="26" fill="#57606a">relaxes all network restrictions</text>

    <rect x="1300" y="90" width="540" height="320" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1570" y="195" font-size="30" font-weight="600" font-family="Consolas, monospace">allowUnsandboxedCommands</text>
    <text x="1570" y="290" font-size="34" font-weight="600">default: true</text>
    <text x="1570" y="345" font-size="26" fill="#57606a">lets commands run outside the sandbox</text>
  </g>
  <g font-size="30" fill="#24292f">
    <rect x="80" y="480" width="1760" height="120" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="130" y="551"><tspan font-weight="600">Switch on, defaults kept:</tspan> filesystem confinement and nothing else</text>
    <rect x="80" y="640" width="1760" height="120" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="130" y="711"><tspan font-weight="600">Switch on, both set to false:</tspan> filesystem policy with outbound network blocked</text>
    <rect x="80" y="840" width="1760" height="120" rx="24" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="130" y="911"><tspan font-weight="600" fill="#c24141">Password prompt:</tspan> the agent cancels the command and tells you to run it interactively</text>
  </g>
</svg>
