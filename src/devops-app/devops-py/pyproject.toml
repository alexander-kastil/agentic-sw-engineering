[project]
name = "devops-py"
version = "0.1.0"
description = "Python Food Shop served by FastAPI with server-rendered Jinja2 pages"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "playwright==1.64.1",
    "pytest==9.2.0",
    "pytest-playwright==0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
base_url = "http://localhost:4300"
