name: DevOps App Python CI

on:
  push:
    paths:
      - "src/devops-app/devops-py/**"
      - ".github/workflows/devops-py-ci.yml"
  pull_request:
    paths:
      - "src/devops-app/devops-py/**"
      - ".github/workflows/devops-py-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  APP_LOCATION: src/devops-app/devops-py

jobs:
  test:
    name: Compile and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_LOCATION }}/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q main.py tests e2e

      - name: Unit tests
        run: python -m pytest

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: End-to-end tests
        run: |
          python -m uvicorn main:app --port 4300 &
          timeout 30 bash -c 'until curl -sf http://localhost:4300/ > /dev/null; do sleep 1; done'
          python -m pytest e2e
